version: "3.9"

services:
  postgres:
    image: postgres:17
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: manga_tracker
    ports:
      - "5432:5432"
    volumes: 
      - postgres_data:/var/lib/postgresql/data
  mage:
    env_file:
      - .env
    build:
      context: .
      dockerfile: mage.Dockerfile
    environment:
      USER_CODE_PATH: /home/src/${PROJECT_NAME}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: manga_tracker
      DBT_PROJECT_NAME: manga_tracker_dbt
    ports:
      - "6789:6789"
    volumes:
      - .:/home/src/  
    restart: on-failure:5
    depends_on:
      - postgres
  flyway:
      image: flyway/flyway:10
      container_name: flyway
      command: -url=jdbc:postgresql://postgres:5432/manga_tracker -user=postgres -password=postgres -locations=filesystem:/flyway/sql -connectRetries=10 migrate
      volumes:
        - ./manga_tracker/utils/migrations:/flyway/sql
      depends_on:
        - postgres
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    restart: on-failure:5
  api:
    build:
      context: .
      dockerfile: api.Dockerfile
    container_name: manga_api
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/manga_tracker
    ports:
      - "8000:8000"
    volumes:
      - ./manga_tracker/api:/app/manga_tracker/api
    depends_on:
      - postgres
      - redis
    restart: on-failure:5
  metabase:
    image: metabase/metabase:v0.55.12
    container_name: metabase
    hostname: metabase
    env_file:
      - .env
    environment:
      MB_DB_TYPE: postgres
      MB_DB_HOST: postgres
      MB_DB_PORT: 5432
      MB_DB_NAME: metabase
      MB_DB_USER: ${POSTGRES_USER}
      MB_DB_PASS: ${POSTGRES_PASSWORD}
    depends_on:
      - postgres
    ports:
      - 3000:3000
volumes:
  postgres_data:
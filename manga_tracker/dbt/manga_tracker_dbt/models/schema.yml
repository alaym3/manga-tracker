version: 2

sources:
  - name: raw
    schema: raw
    tables:
      - name: manga_responses
        columns:
          - name: mangadex_id
            tests:
              - not_null
              - unique
          - name: payload
            tests:
              - not_null
          - name: pulled_at
            tests:
              - not_null
      - name: chapter_responses
        columns:
          - name: mangadex_id
            tests:
              - not_null
              - unique
          - name: manga_id
            tests:
              - not_null:
                  config:
                    severity: warn    # should always be present but defensive
          - name: payload
            tests:
              - not_null
          - name: pulled_at
            tests:
              - not_null
      - name: manga_statistics
        description: "Community statistics per manga from GET /statistics/manga. One row per manga, upserted on each pipeline run."
        columns:
          - name: mangadex_id
            tests:
              - not_null
              - unique
          - name: payload
            tests:
              - not_null
          - name: pulled_at
            tests:
              - not_null
      - name: user_follows
        description: "Manga the user follows on MangaDex, with optional personal rating."
        columns:
          - name: mangadex_id
            tests:
              - not_null
              - unique

models:
  - name: stg_manga
    description: "Cleaned and normalized manga records transformed from raw.manga_responses. One row per manga title."
    columns:
      - name: mangadex_id
        tests:
          - not_null
          - unique
      - name: source
        tests:
          - not_null
          - accepted_values:
              values: ['mangadex']
      - name: title
        tests:
          - not_null:
              config:
                severity: warn          
      - name: status
        tests:
          - accepted_values:
              values: ['ongoing', 'completed', 'hiatus', 'cancelled']
              config:
                severity: warn        # warn not error — upstream data may have nulls
      - name: content_rating
        tests:
          - accepted_values:
              values: ['safe', 'suggestive', 'erotica', 'pornographic']
              config:
                severity: warn
      - name: original_language
        tests:
          - not_null:
              config:
                severity: warn

      - name: cover_url
        tests:
          - not_null:
              config:
                severity: warn

  - name: stg_chapters
    description: "Cleaned and normalized chapter records transformed from raw.chapter_responses."
    columns:
      - name: mangadex_id
        tests:
          - not_null
          - unique
      - name: manga_mangadex_id
        tests:
          - not_null:
              config:
                severity: warn        # chapters may exist for manga not yet loaded
      - name: language
        tests:
          - not_null
      - name: published_at
        tests:
          - not_null:
              config:
                severity: warn        # draft chapters may have null publishAt
      - name: is_unavailable
        tests:
          - not_null
      - name: ingested_at
        tests:
          - not_null

  - name: stg_manga_statistics
    description: "Cleaned community statistics per manga extracted from raw.manga_statistics."
    columns:
      - name: mangadex_id
        tests:
          - not_null
          - unique
      - name: pulled_at
        tests:
          - not_null

  - name: manga
    description: "Reporting-ready manga table joining metadata, community statistics, and personal follow/rating data."
    columns:
      - name: mangadex_id
        tests:
          - not_null
          - unique
      - name: title
        tests:
          - not_null:
              config:
                severity: warn
      - name: is_followed
        tests:
          - not_null
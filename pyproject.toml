[tool.ruff]
line-length = 100
target-version = "py310"

exclude = [
    ".git",
    "__pycache__",
    "manga_tracker/dbt",
    "manga_tracker/.file_versions",
]

[tool.ruff.lint]
# E/W: pycodestyle errors and warnings
# F: pyflakes (undefined names, unused imports, etc.)
# I: isort (import ordering)
select = ["E", "W", "F", "I"]

# E501: line too long — ruff format handles this, no need to error on it too
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["manga_tracker"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
